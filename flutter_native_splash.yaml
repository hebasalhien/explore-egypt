flutter_native_splash:
  # This applies to iOS and older Android versions
  background_image: "assets/images/splash screen.png"
  image: "assets/images/logo2.png"
  android_gravity: center
  fullscreen: true

  android_12:
    # This forces modern Android versions to use your gradient background
    background_image: "assets/images/splash screen.png"
    image: "assets/images/logo2.png"
